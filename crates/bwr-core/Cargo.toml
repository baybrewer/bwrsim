[package]
name = "bwr-core"
description = "Physics engine for a BWRX-300 control room simulator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# Saved engine state must restore bit-exactly; the default float parser is not round-trip exact.
serde_json = { version = "1", features = ["float_roundtrip"] }
